org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Su Windows la sorveglianza del filesystem tiene aperti gli handle dentro build/, e ogni tanto una
# ricompilazione muore con "Unable to delete directory". Spegnerla costa qualche secondo per build e
# toglie un difetto che si presenta a caso.
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
