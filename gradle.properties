org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Niente sorveglianza del filesystem: la cartella del progetto e' sincronizzata da Google Drive
# (vedi build.gradle), e un watcher in piu' sopra un sincronizzatore e' un handle in piu' da
# contendersi. Costa qualche secondo per build.
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
