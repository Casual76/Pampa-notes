plugins {
  alias(libs.plugins.android.library)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.kotlin.serialization)
  alias(libs.plugins.ksp)
  alias(libs.plugins.hilt)
}

android {
  namespace 'dev.pampa.pampanotes.core'
  compileSdk 36

  defaultConfig {
    minSdk 26
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    consumerProguardFiles 'consumer-rules.pro'
  }

  buildFeatures {
    buildConfig false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main.java.setSrcDirs(['src/main/kotlin'])
    test.java.setSrcDirs(['src/test/kotlin'])
    test.resources.setSrcDirs(['src/test/resources'])
    androidTest.java.setSrcDirs(['src/androidTest/kotlin'])
    // Gli schemi esportati da Room, per i test di migrazione.
    androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

ksp {
  arg('room.schemaLocation', "$projectDir/schemas".toString())
  arg('room.generateKotlin', 'true')
}

dependencies {
  api project(':engine-foundation')
  api project(':engine-ai')

  implementation libs.androidx.core.ktx
  implementation libs.kotlinx.coroutines.core
  implementation libs.kotlinx.coroutines.android
  implementation libs.serialization.json
  implementation libs.room.runtime
  implementation libs.room.ktx
  ksp libs.room.compiler
  implementation libs.datastore.preferences
  implementation libs.hilt.android
  ksp libs.hilt.compiler
  implementation libs.pdfbox.android
  implementation libs.androidx.documentfile

  testImplementation libs.junit4
  testImplementation libs.mockk
  testImplementation libs.kotlinx.coroutines.test
  testImplementation libs.turbine
  androidTestImplementation libs.androidx.test.ext.junit
  androidTestImplementation libs.androidx.test.runner
  androidTestImplementation libs.room.testing
  androidTestImplementation libs.kotlinx.coroutines.test
}
