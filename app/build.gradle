// La chiave di firma vive fuori dal repo. Due strade, nell'ordine:
//   1. local.properties (git-ignorato):
//        pampa.storeFile=C:/VibeCoded Projects/pampa.jks
//        pampa.storePassword=...
//        pampa.keyAlias=pampa
//        pampa.keyPassword=...
//   2. variabili d'ambiente PAMPA_RELEASE_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD.
// Senza chiave si compila lo stesso con la firma di debug, e lo si dice: quella build non e'
// pubblicabile sul Pampa Store.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
  localPropsFile.withInputStream { localProps.load(it) }
}
def signingValue = { String prop, String env ->
  def v = localProps.getProperty(prop)
  if (v == null || v.trim().isEmpty()) v = System.getenv(env)
  return (v == null || v.trim().isEmpty()) ? null : v.trim()
}
def keyStorePath = signingValue('pampa.storeFile', 'PAMPA_RELEASE_STORE_FILE')
def keyStorePassword = signingValue('pampa.storePassword', 'PAMPA_RELEASE_STORE_PASSWORD')
def keyAliasValue = signingValue('pampa.keyAlias', 'PAMPA_RELEASE_KEY_ALIAS') ?: 'pampa'
def keyPasswordValue = signingValue('pampa.keyPassword', 'PAMPA_RELEASE_KEY_PASSWORD')
def missingKey = []
if (keyStorePath == null) {
  missingKey << 'pampa.storeFile'
} else if (!rootProject.file(keyStorePath).exists()) {
  missingKey << "pampa.storeFile (il file ${keyStorePath} non esiste)"
}
if (keyStorePassword == null) missingKey << 'pampa.storePassword'
if (keyPasswordValue == null) missingKey << 'pampa.keyPassword'
def hasReleaseKey = missingKey.isEmpty()
// Il client ID OAuth (tipo Web) del progetto Google: e' l'`aud` dell'ID token, e il Worker ha lo
// stesso valore in wrangler.toml. Vuoto: la pagina Sincronizzazione chiede un codice, non Google.
def googleClientId = signingValue('pampa.googleClientId', 'PAMPA_GOOGLE_CLIENT_ID') ?: ''
if (googleClientId.isEmpty()) println "Pampa Notes: pampa.googleClientId non impostato: accesso Google spento in questa build."
// L'indice in cloud che «Accedi con Google» usa quando l'utente non ne ha scritto un altro: chi
// entra dal primo avvio non sa cos'e' un Worker, e non deve saperlo. Si cambia per provare un
// Worker diverso senza toccare il codice.
def defaultSyncUrl = signingValue('pampa.syncUrl', 'PAMPA_SYNC_URL') ?: 'https://pampa-notes-sync.fluid-transit.workers.dev'
if (!hasReleaseKey && keyStorePath != null) {
  println "Pampa Notes: firma pampa incompleta (manca ${missingKey.join(', ')}): build firmata DEBUG."
}

android {
  namespace 'dev.pampa.pampanotes'
  compileSdk 36

  defaultConfig {
    applicationId 'dev.pampa.pampanotes'
    minSdk 26
    targetSdk 36
    versionCode 6
    // Letterale: il publisher dello store legge questa riga con una regex che capisce solo stringhe.
    versionName '1.0.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    vectorDrawables.useSupportLibrary = true

    // Lo stesso documento serve sia gli aggiornamenti sia i flag: sezioni diverse, un URL solo.
    buildConfigField 'String', 'MANIFEST_URL', '"https://raw.githubusercontent.com/Casual76/Pampa-notes/main/manifest.json"'
    buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${googleClientId}\""
    buildConfigField 'String', 'DEFAULT_SYNC_URL', "\"${defaultSyncUrl}\""
  }

  signingConfigs {
    if (hasReleaseKey) {
      release {
        storeFile rootProject.file(keyStorePath)
        storePassword keyStorePassword
        keyAlias keyAliasValue
        keyPassword keyPasswordValue
        // La v1 va accesa a mano: AGP la toglie con minSdk >= 24, e il publisher dello store
        // convalida proprio la presenza della firma JAR (META-INF/*.RSA) prima di caricare.
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
      }
    }
  }

  buildTypes {
    debug {
      // Un suffisso, cosi' una build di lavoro convive sul telefono con quella dello store.
      applicationIdSuffix '.debug'
      versionNameSuffix '-debug'
    }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (hasReleaseKey) {
        signingConfig signingConfigs.release
      } else {
        signingConfig signingConfigs.debug
        println 'Pampa Notes: nessuna chiave pampa: release firmata DEBUG, non pubblicabile.'
      }
    }
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
    freeCompilerArgs += [
      '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
      '-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi',
    ]
  }

  packaging {
    resources {
      excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
  }

  lint {
    warning 'HighAppVersionCode'
  }

  sourceSets {
    main.java.setSrcDirs(['src/main/kotlin'])
    test.java.setSrcDirs(['src/test/kotlin'])
    androidTest.java.setSrcDirs(['src/androidTest/kotlin'])
  }
}

